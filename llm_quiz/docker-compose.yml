services:
  quiz:
    build: .
    image: language-quiz
    container_name: language-quiz
    ports:
      - "8070:8070"
    environment:
      # Read from host env or .env in this directory; override as needed.
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-180}
      - LLM_JSON_MODE=${LLM_JSON_MODE:-true}
      - DB_PATH=/app/backend/data/quizzes.db
    volumes:
      - ./data:/app/backend/data
    restart: unless-stopped
