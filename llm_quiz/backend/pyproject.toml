[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "language-learning-quiz"
version = "0.1.0"
description = "多语言选词填空出题服务：FastAPI + LLM 创作 + 各语言引擎标注 + SQLite 存储"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "fugashi>=1.3",
    "unidic-lite>=1.0.8",
    "sqlalchemy>=2.0.52",
    "aiosqlite>=0.22.1",
    "openai>=3.5.0",
]

[tool.setuptools]
packages = [
    "app",
    "app.engines",
    "app.engines.japanese",
    "app.services",
    "app.routers",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
